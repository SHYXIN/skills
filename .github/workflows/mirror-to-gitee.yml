name: Mirror to Gitee

# 每次 push 到 master 时，自动将仓库镜像推送到 Gitee（theshyxin/skills），
# 供国内用户经 cn-skills 免翻墙安装。
on:
  push:
    branches: [master]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Gitee SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GITEE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts

      - name: Push to Gitee
        run: |
          git remote add gitee git@gitee.com:theshyxin/skills.git
          git push gitee master --force
