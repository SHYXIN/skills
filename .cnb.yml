# CNB 为主平台时的镜像编排。
# 依赖「密钥仓库」shy-xin/secrets 中的 skills/envs.yml（经 imports 注入为环境变量）：
#   GITHUB_TOKEN  : 具备 repo 写权限的 GitHub PAT
#   GITEE_SSH_KEY : Gitee 私钥全文
# 注意：CNB 不会自动把仓库设置里的密钥注入脚本，必须用 imports 从密钥仓库引入
#       （仓库 设置→变量/密钥 那处不生效，这就是上次 $GITHUB_TOKEN 为空的原因）。

master:
  push:
    - name: mirror-to-github-and-gitee
      imports: https://cnb.cool/shy-xin/secrets/-/blob/master/skills/envs.yml
      stages:
        - name: mirror
          image: node:20
          script: |
            apt-get update -y && apt-get install -y git openssh-client
            git config --global user.name "cnb-mirror[bot]"
            git config --global user.email "cnb-mirror[bot]@cnb.cool"
            git fetch origin --tags

            # → GitHub (HTTPS + PAT)
            git remote add github https://$GITHUB_TOKEN@github.com/SHYXIN/skills.git
            git push github master --force --tags

            # → Gitee (SSH key)；未配置 GITEE_SSH_KEY 时跳过，避免构建失败
            if [ -n "$GITEE_SSH_KEY" ]; then
              mkdir -p ~/.ssh
              printf '%s\n' "$GITEE_SSH_KEY" > ~/.ssh/id_rsa
              chmod 600 ~/.ssh/id_rsa
              ssh-keyscan gitee.com >> ~/.ssh/known_hosts
              git remote add gitee git@gitee.com:theshyxin/skills.git
              git push gitee master --force --tags
            else
              echo "GITEE_SSH_KEY 未配置，跳过 Gitee 同步"
            fi
