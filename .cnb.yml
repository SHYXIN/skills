# CNB 为主平台时的镜像编排。
# 触发：push 到 master 分支。
# 动作：把仓库同步到 GitHub 与 Gitee（Gitee 为终点，无回推，不会形成环）。
# 依赖 CNB 仓库密钥（Settings → 密钥）：
#   GITHUB_TOKEN  : 具备 repo 写权限的 GitHub Personal Access Token
#   GITEE_SSH_KEY : Gitee 私钥（与 GitHub 上 GITEE_SSH_KEY 同源）
# 注意：GitHub 上的 mirror-to-cnb.yml 已改名为 .disabled 禁用，避免 CNB↔GitHub 死循环。

master:
  push:
    - name: mirror-to-github-and-gitee
      stages:
        - name: mirror
          image: node:20
          script: |
            apt-get update -y && apt-get install -y git openssh-client
            git config --global user.name "cnb-mirror[bot]"
            git config --global user.email "cnb-mirror[bot]@cnb.cool"
            git fetch --unshallow --tags || true

            # → GitHub (HTTPS + PAT)
            git remote add github https://$GITHUB_TOKEN@github.com/SHYXIN/skills.git
            git push github master --force --tags

            # → Gitee (SSH key)
            mkdir -p ~/.ssh
            printf '%s\n' "$GITEE_SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan gitee.com >> ~/.ssh/known_hosts
            git remote add gitee git@gitee.com:theshyxin/skills.git
            git push gitee master --force --tags
